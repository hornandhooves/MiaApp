# Scripts de instalacion autorizados. pnpm 10+ los bloquea por defecto
# y aborta en CI si no estan listados aqui.
#
# NOTA: el parche de expo-modules-jsi NO se maneja con patchedDependencies.
# Esa via depende de que el gestor lea la configuracion del lugar correcto,
# y eso cambio entre versiones de pnpm, rompiendo EAS Build con
# ERR_PNPM_LOCKFILE_CONFIG_MISMATCH. Ahora lo aplica
# scripts/patch-expo-jsi.mjs desde postinstall: funciona en cualquier
# gestor y cualquier CI.
onlyBuiltDependencies:
  - '@firebase/util'
  - esbuild
  - protobufjs
  - unrs-resolver
