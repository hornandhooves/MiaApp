# Configuracion de pnpm (desde pnpm 10 los ajustes viven aqui, no en el
# campo "pnpm" de package.json).
#
# Scripts de instalacion: pnpm 10 los bloquea por defecto y ABORTA con
# ERR_PNPM_IGNORED_BUILDS. Listamos los que necesitamos y ademas
# desactivamos la falla dura, porque en EAS Build la lista sola no basto.
onlyBuiltDependencies:
  - '@firebase/util'
  - esbuild
  - protobufjs
  - unrs-resolver

# No abortar si queda algun script sin ejecutar.
strictDepBuilds: false
